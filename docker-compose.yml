services:
  postgres:
    image: postgres:17
    container_name: apotheca-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apotheca
      POSTGRES_PASSWORD: apotheca
      POSTGRES_DB: apotheca
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: apotheca-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@apotheca.dev
      PGADMIN_DEFAULT_PASSWORD: apotheca
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
